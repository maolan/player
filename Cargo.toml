[package]
name = "maolan-player"
version = "0.0.1"
edition = "2024"
description = "Simple music player built on maolan-engine"
license = "BSD-2-Clause"
publish = false

[dependencies]
maolan-engine = "0.3.4"
maolan-widgets = "0.0.38"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.2"
tokio = { version = "1.48.0", features = ["sync", "time", "rt", "macros"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
ksni = "0.3"
resvg = "0.45"
tiny-skia = "0.11"
